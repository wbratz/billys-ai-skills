# Marketplace categories
# To propose a new category, open an issue before using it in a submission.

categories:
  - id: dev-tools
    name: Developer Tools
    description: Git, CI/CD, code review, and general development workflow utilities.

  - id: code-gen
    name: Code Generation
    description: Skills that generate, scaffold, or transform code.

  - id: testing
    name: Testing & QA
    description: Test writing, coverage analysis, mutation testing, and QA automation.

  - id: docs
    name: Documentation
    description: README generation, docstring writing, changelog management.

  - id: project-mgmt
    name: Project Management
    description: Task tracking, sprint planning, issue triage, and roadmap tooling.

  - id: data
    name: Data & Analytics
    description: SQL, data pipelines, notebook assistance, and analytics workflows.

  - id: infra
    name: Infrastructure & DevOps
    description: Docker, Kubernetes, Terraform, cloud providers, and deployment.

  - id: security
    name: Security
    description: Security review, vulnerability scanning, and hardening workflows.

  - id: ai-ml
    name: AI / ML
    description: Model training, prompt engineering, evaluation, and MLOps.

  - id: productivity
    name: Productivity
    description: General-purpose productivity, note-taking, scheduling, and research.

  - id: integrations
    name: Integrations
    description: Third-party service connectors - Slack, Linear, GitHub, Jira, etc.

  - id: long-context
    name: Long Context & RAG
    description: Workflows for processing context larger than a model's window - RLM, RAG, summarization pipelines.
