# Claude Skills & Agent Marketplace - Master Registry
# Every published skill, agent, and plugin must have an entry here.
# Fields: id, type, name, description, category, author, version, path, tags
# See docs/registry-spec.md for the full schema.

skills: []

agents: []

plugins:
  - id: billys/rlm
    type: plugin
    name: RLM (Recursive Language Model)
    description: Long-context analysis via recursive model loops over files, dirs, PDFs, logs, URLs, and corpora.
    category: long-context
    author: billys
    version: 0.1.0
    path: plugins/billys-rlm/plugin.md
    tags: [rlm, long-context, pdf, corpus, agents, claude]

  - id: billys/rlm-auto
    type: plugin
    name: RLM Auto (passive routing + dogfood evaluator)
    description: Passive RLM routing companion. Hooks classify prompts, auto-run RLM under a cost cap, project savings, and grade every decision locally.
    category: long-context
    author: billys
    version: 0.1.0
    path: plugins/billys-rlm-auto/plugin.md
    tags: [rlm, router, hook, cost, evaluation, passive, dogfood, claude]
    requires: [billys/rlm]
