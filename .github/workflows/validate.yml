name: Validate Claude Registry

on:
  pull_request:
    paths:
      - "claude/registry/**"
      - "claude/skills/**"
      - "claude/agents/**"
      - "claude/plugins/**"
      - "claude/templates/**"
      - "claude/tools/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: claude/tools
        run: npm ci

      - name: Validate registry
        working-directory: claude/tools
        run: node validate.js
